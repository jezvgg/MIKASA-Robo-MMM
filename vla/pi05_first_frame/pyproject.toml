[project]
name = "mikasa-pi05"
version = "0.1.0"
description = "pi0.5 (openpi, JAX) baseline for MIKASA SameDrawer with the episode's first frame as a 4th image"
requires-python = ">=3.11,<3.12"
# Installed into openpi's own venv (see scripts/setup_server.sh); openpi provides
# jax, av, pyarrow, numpy and tyro at the versions pinned by its uv.lock.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mikasa_pi05"]
