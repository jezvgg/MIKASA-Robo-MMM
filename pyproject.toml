[project]
name = "mikasa-robo-mmm"
version = "0.1.0"
description = "MIKASA Robo MMM benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mani_skill==3.0.0b22",
    "mplib==0.2.1; sys_platform == 'linux'",
    "torch>=2.0",
    "pillow",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
override-dependencies = ["mplib==0.2.1; sys_platform == 'linux'"]
